[package]
name = "ctopx"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
description = "ctop-style container monitor with alert notifications (ntfy, Telegram, GNTP, webhook), REST API and web UI"
license = "MIT"
readme = "README.md"

[dependencies]
actix-web = "4.20.0"
anyhow = "1.0.104"
bollard = "0.21.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
clap-version-flag = "1.0.7"
clap-color-hep = "0.1.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.4"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
