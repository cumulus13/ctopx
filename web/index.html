<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>ctopx</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23131f2b'/%3E%3Crect x='6' y='7' width='20' height='5' rx='1.5' fill='%237f93ff'/%3E%3Crect x='6' y='14' width='20' height='5' rx='1.5' fill='%2346c28a'/%3E%3Crect x='6' y='21' width='12' height='5' rx='1.5' fill='%23f0a53a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('ctopx-theme'); } catch (e) {}
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>
<div class="app">
  <aside class="rail">
    <a class="brand" href="#/containers" aria-label="ctopx home">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="6" rx="2" fill="var(--accent)"/><rect x="3" y="13" width="26" height="6" rx="2" fill="var(--ok)"/><rect x="3" y="21" width="15" height="6" rx="2" fill="var(--warn)"/></svg>
      <span>ctopx</span>
    </a>
    <div class="instance" id="instance"></div>
    <nav class="nav" aria-label="Main">
      <a href="#/containers" data-page="containers">Containers</a>
      <a href="#/alerts" data-page="alerts">Alerts <span class="badge" id="alert-badge" hidden>0</span></a>
      <a href="#/events" data-page="events">Events</a>
      <a href="#/rules" data-page="rules">Rules</a>
      <a href="#/channels" data-page="channels">Channels</a>
    </nav>
    <div class="rail-foot">
      <div class="conn" id="conn"><i></i><span>Connecting</span></div>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch between light and dark theme" title="Switch theme">
        <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Container details" hidden></aside>

<dialog id="dlg-token">
  <form method="dialog" id="f-token">
    <h2>Access token required</h2>
    <p>This ctopx server is protected. Enter the value of <code>server.token</code> from its config.</p>
    <input id="token-input" type="password" autocomplete="current-password" aria-label="Access token" required>
    <div class="dlg-actions"><button class="btn primary" value="ok">Sign in</button></div>
  </form>
</dialog>

<dialog id="dlg-silence">
  <form method="dialog" id="f-silence">
    <h2>Silence notifications</h2>
    <p class="muted">Alerts still appear here and in the history. Only notifications are muted.</p>
    <label>Subject <input id="sil-pattern" required></label>
    <label>Applies to
      <select id="sil-rule"></select>
    </label>
    <label>For
      <select id="sil-dur">
        <option value="900">15 minutes</option>
        <option value="3600" selected>1 hour</option>
        <option value="14400">4 hours</option>
        <option value="86400">24 hours</option>
      </select>
    </label>
    <label>Reason <input id="sil-reason" placeholder="Optional"></label>
    <div class="dlg-actions">
      <button class="btn" value="cancel" type="button" id="sil-cancel">Cancel</button>
      <button class="btn primary" value="ok">Silence</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/app.js" defer></script>
</body>
</html>
